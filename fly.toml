# fly.toml — AgentFi backend deploy on Fly.io
# Docs: https://fly.io/docs/reference/configuration/
#
# First-time setup:
#   fly launch --no-deploy --name agentfi-backend
#   fly pg create --name agentfi-pg
#   fly pg attach agentfi-pg
#   fly redis create   # or: set REDIS_URL manually (Upstash recommended)
#   fly secrets import < .env
#   fly deploy

app            = "agentfi-backend"
primary_region = "gru"          # São Paulo — closest to target audience

[build]
  dockerfile = "Dockerfile.backend"

[env]
  NODE_ENV    = "production"
  PORT        = "8080"
  API_PORT    = "8080"

[[services]]
  internal_port = 8080
  protocol      = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port     = 80
    force_https = true

  [[services.ports]]
    handlers = ["tls", "http"]
    port     = 443

  [services.concurrency]
    type       = "connections"
    hard_limit = 100
    soft_limit = 80

  [[services.http_checks]]
    interval       = 30000
    timeout        = 5000
    grace_period   = "15s"
    method         = "GET"
    path           = "/health"
    protocol       = "http"
    restart_limit  = 3

[[vm]]
  memory   = "512mb"
  cpu_kind = "shared"
  cpus     = 1
