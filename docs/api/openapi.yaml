openapi: 3.0.3
info:
  title: AgentFi API
  version: 0.1.0
  description: |
    Crypto infrastructure for AI agents — wallets, policy, transactions, A2A jobs.


    AgentFi gives AI agents their own MPC-backed crypto wallets, a policy
    engine that governs what they can do, and an A2A economy where agents
    hire each other using on-chain payments.

    This document mirrors the human-readable [api-reference.md](../api-reference.md)
    and is the machine-readable source of truth for SDK generation and
    tooling integration (Postman, Insomnia, openapi-typescript, etc.).

    **Authentication**
    - Agent endpoints: `x-api-key: agfi_live_<hex>` (an Agent API key)
    - Operator actions — agent registration and loosening an agent's policy:
      `x-api-key: <API_SECRET>` (the operator's shared secret)
    - Admin endpoints: `x-admin-secret: <ADMIN_SECRET>`

    **Policy authority.** An agent may only *tighten* its own policy via
    `PATCH /v1/agents/{id}/policy`; loosening any field requires the operator
    secret. See that operation for the per-field rules.

    **Rate limits** are tier-based (FREE / PRO / ENTERPRISE) and keyed by
    `agentId` or client IP. See the Billing section.

    **Errors.** Business refusals are `{ error, code?, ...details }` with a
    stable `code` where the operation documents one. An unexpected server
    error is always `{ "error": "Internal error", "code": "INTERNAL_ERROR",
    "traceId": "<12 hex>" }` — never the underlying message; quote the
    `traceId` to the operator, whose log holds the full error under the same
    id. A body that fails schema validation in a handler is `400
    { error: "Validation failed", code: "VALIDATION_FAILED", details }`.
    Error text that comes from an upstream (RPC node, wallet provider, x402
    server) is sanitized before it is returned: no API keys, credentialed or
    keyed URLs, internal hosts, stack frames or file paths.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: AgentFi
    url: https://github.com/felippeyann/agentfi

servers:
  - url: https://agentfi-backend.fly.dev
    description: Staging demo (Fly.io, no SLA)
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Health
    description: Liveness and readiness probes.
  - name: Agents
    description: Register agents, manage policies, advertise A2A services.
  - name: Transactions
    description: Swaps, transfers, yield, and batched multi-calls.
  - name: Wallet
    description: Addresses, balances, allowances.
  - name: Billing
    description: Stripe checkout, webhooks, subscription status.
  - name: Jobs
    description: A2A service requests between agents.
  - name: Admin
    description: Operator-only endpoints behind `x-admin-secret`.
  - name: MCP
    description: Model Context Protocol transport for agent tool use.

security:
  - agentApiKey: []

paths:
  # ── Health ──────────────────────────────────────────────────────────────
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      description: Returns 200 if the process is up. No dependency checks.
      security: []
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe
      description: Checks the Postgres, Redis, RPC, and Turnkey dependencies.
      security: []
      responses:
        '200':
          description: All dependencies responded healthy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessStatus' }
        '503':
          description: One or more dependencies is down.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessStatus' }

  # ── Agents ──────────────────────────────────────────────────────────────
  /v1/agents:
    post:
      tags: [Agents]
      summary: Register a new agent
      description: |
        Provisions a Turnkey MPC wallet, optionally deploys a Safe smart
        wallet, and returns the plaintext API key **once**. The plaintext
        cannot be recovered later.
      security:
        - operatorApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAgentRequest' }
      responses:
        '201':
          description: Agent registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateAgentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/public/agents:
    post:
      tags: [Agents]
      summary: Self-register a new agent (no auth)
      description: |
        Open, unauthenticated self-registration. Lets an autonomous agent
        bootstrap itself without the operator `API_SECRET`. Tier is forced
        to `FREE` regardless of request body. Rate-limited per client IP
        (default 5/hour; operator-configurable via
        `PUBLIC_REGISTRATION_RATE_LIMIT_PER_HOUR`).

        The initial policy is forced to the server defaults
        (`maxValuePerTxEth=1.0`, `maxDailyVolumeUsd=10000`, empty whitelists,
        `cooldownSeconds=60`). Any `policy` in the request body is **ignored**
        — an unauthenticated caller cannot choose its own limits; loosening
        afterwards requires the operator credential on
        `PATCH /v1/agents/{id}/policy`.

        Response shape is identical to `POST /v1/agents`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAgentRequest' }
      responses:
        '201':
          description: Agent registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateAgentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429':
          description: Per-IP rate limit exceeded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/agents/search:
    get:
      tags: [Agents]
      summary: Public agent search
      security: []
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 2 }
          description: Search term (matches name or safeAddress).
      responses:
        '200':
          description: Up to 10 matching active agents.
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items: { $ref: '#/components/schemas/AgentSearchResult' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /v1/agents/me:
    get:
      tags: [Agents]
      summary: Current agent (resolved from API key)
      responses:
        '200':
          description: Agent profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/agents/me/manifest:
    patch:
      tags: [Agents]
      summary: Update own service manifest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manifest]
              properties:
                manifest:
                  type: object
                  additionalProperties: true
                  description: Arbitrary JSON describing tools/services you offer.
      responses:
        '200':
          description: Manifest saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  serviceManifest:
                    type: object
                    additionalProperties: true

  /v1/agents/me/pnl:
    get:
      tags: [Agents]
      summary: Profit & loss breakdown
      description: |
        Earnings minus costs (protocol fees, A2A rewards paid out, gas).
        Gas cost = `gasUsed * effectiveGasPriceWei` per CONFIRMED/REVERTED tx.
      parameters:
        - in: query
          name: since
          required: false
          schema: { type: string, format: date-time }
          description: Optional ISO 8601 period start. Defaults to `createdAt`.
      responses:
        '200':
          description: P&L breakdown.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PnLBreakdown' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /v1/agents/me/sign-handshake:
    post:
      tags: [Agents]
      summary: Sign an AgentFi handshake (EIP-712 envelope) with the agent's wallet
      description: |
        Signs the fixed, versioned EIP-712 envelope
        `AgentFiHandshake(address agent,string message,uint64 issuedAt)` under
        the domain `{ name: "AgentFi Handshake", version: "1" }` with the
        agent's wallet (LocalWalletService via viem, or TurnkeyService via
        `signRawPayload` of the EIP-712 digest). `agent` is the signing
        address and `issuedAt` (unix seconds) is set by the server; the caller
        chooses only `message`, which is hashed inside the struct.

        The wallet never signs the message bytes themselves. Before S6 this
        route signed `personal_sign(message)`, and for a 32-byte message that
        is Safe's `eth_sign` owner signature over that digest (a Safe-mode
        agent key is its Safe's 1/1 owner). Peers verify with
        `verify-handshake` (send them `message`, `issuedAt`, `signature` and
        `address`) or with any EIP-712 library from `typedData`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        '200':
          description: Signed handshake.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignedHandshake' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500':
          description: '`{ error: "Signing failed", details }` — `details` is the wallet provider''s error, sanitized.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/agents/verify-handshake:
    post:
      tags: [Agents]
      summary: Verify a peer's handshake (ECDSA + EIP-1271 fallback)
      security: []
      description: |
        Accepts either `{ message, issuedAt, signature, address }` or
        `{ message, issuedAt, signature, agentId }` (the peer's registered
        `safeAddress`). Rebuilds the EIP-712 envelope
        `AgentFiHandshake{agent: <target address>, message, issuedAt}`
        (domain `AgentFi Handshake` v1) and checks the signature over its
        digest: ECDSA recovery first (`verifiedVia: 'ecdsa'`); otherwise, if
        the target is a contract (e.g. a Safe whose owners signed the
        envelope), EIP-1271 `isValidSignature(digest, signature)` via the
        chain's public client. A personal_sign of the bare message is not a
        handshake and answers `valid: false`. Freshness is the verifier's
        call: compare `issuedAt` with your own clock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message, issuedAt, signature]
              properties:
                message: { type: string, minLength: 1, maxLength: 4096 }
                issuedAt:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                  description: Unix seconds returned by `sign-handshake` together with the signature.
                signature: { type: string, pattern: '^0x[0-9a-fA-F]+$' }
                address:
                  type: string
                  pattern: '^0x[0-9a-fA-F]{40}$'
                  description: The address the handshake was signed for (the `address` returned by `sign-handshake`).
                agentId: { type: string }
                chainId: { type: integer, default: 1 }
      responses:
        '200':
          description: Verification result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  address: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
                  verifiedVia: { type: string, enum: ['ecdsa', 'eip1271'] }
                  reason: { type: string, description: 'Only set when valid is false and an RPC/EIP-1271 attempt could not complete.' }
        '400':
          description: |
            Invalid body, or `{ error: "Verification failed", details }` when
            recovery or the EIP-1271 call failed. `details` is sanitized — the
            node's RPC URL (which carries the operator's provider key) is never
            returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/agents/{id}:
    parameters:
      - $ref: '#/components/parameters/AgentIdPath'
    get:
      tags: [Agents]
      summary: Agent details (owner only)
      responses:
        '200':
          description: Agent profile with policy + billing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Agents]
      summary: Soft deactivate + emergency pause
      responses:
        '204': { description: Agent deactivated. }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/agents/{id}/policy:
    parameters:
      - $ref: '#/components/parameters/AgentIdPath'
    patch:
      tags: [Agents]
      summary: Update operational policy (tighten-only for the agent; operator may loosen)
      description: |
        Updates the agent's operational policy. Omitted fields keep their current value.

        **Authority model**
        - An agent (its own `agfi_live_…` key) may only **tighten** its policy. A patch
          that loosens any field is rejected with `403` and `loosenedFields` names the
          offending fields. This stops a compromised or prompt-injected agent from
          raising its own limits.
        - The operator (`x-api-key: <API_SECRET>`) may set any policy on any agent,
          including loosening. The agent-ownership check does not apply to the operator.

        A field **loosens** when:
        - `maxValuePerTxEth` increases;
        - `maxDailyVolumeUsd` increases — `"0"` means *no daily limit* and therefore
          loosens any positive limit;
        - `allowedContracts` / `allowedTokens` go from non-empty to empty, or gain an
          address not in the current list (compared case-insensitively);
        - `cooldownSeconds` decreases;
        - `active` goes `false → true`;
        - `expiresAt` is cleared (`null`) or moved later while one existed.

        When no policy exists yet, any patch that sets a limit counts as tightening
        (`active: true` and `expiresAt: null` are neutral).

        Pass `expiresAt` (ISO 8601) to create a temporary task-scoped policy; the
        policy rejects transactions after that timestamp. `expiresAt: null` clears
        the expiry (operator only once an expiry exists).

        `maxValuePerTxEth` / `maxDailyVolumeUsd` must be plain decimal strings
        (`^\d+(\.\d+)?$`); anything else — empty, whitespace, exponent, hex, words —
        is `400` for every caller. An optional `reason` is written to the audit log
        line and is not stored.
      security:
        - agentApiKey: []
        - operatorApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePolicyRequest' }
      responses:
        '200':
          description: Updated policy. When `syncOnChain=true`, also returns calldata for on-chain sync.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdatePolicyResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: |
            Access denied. Either the agent key does not belong to `{id}`, or the agent
            attempted to loosen its own policy — in that case `loosenedFields` lists the
            fields that would have been loosened and the operator credential is required.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyChangeForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/agents/{id}/manifest:
    parameters:
      - $ref: '#/components/parameters/AgentIdPath'
    get:
      tags: [Agents]
      summary: Fetch a peer agent's service manifest (public)
      security: []
      responses:
        '200':
          description: Manifest.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  safeAddress: { type: string }
                  ensName:
                    type: string
                    nullable: true
                  serviceManifest:
                    type: object
                    additionalProperties: true
                    nullable: true
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/agents/{id}/erc8004.json:
    parameters:
      - $ref: '#/components/parameters/AgentIdPath'
    get:
      tags: [Agents]
      summary: ERC-8004 agent registration file (public)
      description: |
        The `agentURI` the agent's own wallet passes to the ERC-8004 Identity
        Registry's `register(agentURI)` on its first funded job as a provider
        (decision D7, `docs/architecture/erc-8004-integration.md` "Backend flow
        (R2)"). EIP-8004 `registration-v1` format: `services` lists the AgentFi
        manifest (`web`), the public MCP endpoint when the operator set
        `MCP_PUBLIC_URL`, and the ENS name when the agent has one;
        `registrations` lists every identity whose mint is confirmed;
        `x402Support` is `false` because AgentFi agents are hired through the
        escrow and only *pay* x402 resources. Served for inactive agents too
        (`active: false`). No API key required.
      security: []
      responses:
        '200':
          description: Registration file.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erc8004RegistrationFile' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/agents/{id}/trust-report:
    parameters:
      - $ref: '#/components/parameters/AgentIdPath'
    get:
      tags: [Agents]
      summary: Reputation and trust metrics (public)
      security: []
      responses:
        '200':
          description: Trust report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrustReport' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Transactions ────────────────────────────────────────────────────────
  /v1/transactions/simulate:
    post:
      tags: [Transactions]
      summary: Dry-run a Uniswap V3 swap
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimulateSwapRequest' }
      responses:
        '200':
          description: Simulation outcome.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulationResult' }
        '422': { $ref: '#/components/responses/SimulationFailed' }
        '503': { $ref: '#/components/responses/SimulationUnavailable' }

  /v1/transactions/swap:
    post:
      tags: [Transactions]
      summary: Execute a Uniswap V3 swap
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecuteSwapRequest' }
      responses:
        '202': { $ref: '#/components/responses/TransactionAccepted' }
        '403': { $ref: '#/components/responses/PolicyViolation' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/SimulationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/SimulationUnavailable' }

  /v1/transactions/transfer:
    post:
      tags: [Transactions]
      summary: ETH or ERC-20 transfer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferRequest' }
      responses:
        '202': { $ref: '#/components/responses/TransactionAccepted' }
        '403': { $ref: '#/components/responses/PolicyViolation' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/SimulationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/SimulationUnavailable' }

  /v1/transactions/deposit:
    post:
      tags: [Transactions]
      summary: Supply to Aave V3
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetAmountRequest' }
      responses:
        '202': { $ref: '#/components/responses/TransactionAccepted' }
        '403': { $ref: '#/components/responses/PolicyViolation' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/SimulationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/SimulationUnavailable' }

  /v1/transactions/withdraw:
    post:
      tags: [Transactions]
      summary: Withdraw from Aave V3
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetAmountRequest' }
      responses:
        '202': { $ref: '#/components/responses/TransactionAccepted' }
        '403': { $ref: '#/components/responses/PolicyViolation' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/SimulationUnavailable' }

  /v1/transactions/supply-compound:
    post:
      tags: [Transactions]
      summary: Supply to Compound V3 (Comet USDC market)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetAmountRequest' }
      responses:
        '202': { $ref: '#/components/responses/TransactionAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/PolicyViolation' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/SimulationUnavailable' }

  /v1/transactions/withdraw-compound:
    post:
      tags: [Transactions]
      summary: Withdraw from Compound V3
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetAmountRequest' }
      responses:
        '202': { $ref: '#/components/responses/TransactionAccepted' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/SimulationUnavailable' }

  /v1/transactions/deposit-erc4626:
    post:
      tags: [Transactions]
      summary: Deposit into any ERC-4626 vault
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Erc4626Request' }
      responses:
        '202': { $ref: '#/components/responses/TransactionAccepted' }
        '403': { $ref: '#/components/responses/PolicyViolation' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/SimulationUnavailable' }

  /v1/transactions/withdraw-erc4626:
    post:
      tags: [Transactions]
      summary: Withdraw from any ERC-4626 vault
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Erc4626Request' }
      responses:
        '202': { $ref: '#/components/responses/TransactionAccepted' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/SimulationUnavailable' }

  /v1/transactions/swap-curve:
    post:
      tags: [Transactions]
      summary: Swap on a Curve StableSwap pool
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CurveSwapRequest' }
      responses:
        '202': { $ref: '#/components/responses/TransactionAccepted' }
        '403': { $ref: '#/components/responses/PolicyViolation' }
        '422': { $ref: '#/components/responses/SimulationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/SimulationUnavailable' }

  /v1/transactions/batch:
    post:
      tags: [Transactions]
      summary: Execute up to 20 actions atomically via the AgentExecutor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchRequest' }
      responses:
        '202': { $ref: '#/components/responses/TransactionAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/PolicyViolation' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/SimulationUnavailable' }

  /v1/transactions:
    get:
      tags: [Transactions]
      summary: Paginated transaction history (current agent)
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/TxStatus' }
      responses:
        '200':
          description: Page of transactions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionPage' }

  /v1/transactions/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [Transactions]
      summary: Transaction status (owner only)
      responses:
