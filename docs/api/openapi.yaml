  # ── Jobs (A2A) ──────────────────────────────────────────────────────────
  /v1/jobs:
    post:
      tags: [Jobs]
      summary: Create a service request for another agent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateJobRequest' }
      description: |
        A paid job (`reward`) must name `reward.chainId` and `reward.token`:
        there is no Ethereum-mainnet / ETH default any more (X3a), so a
        missing one is `400 VALIDATION_FAILED`.

        On a chain where the ERC-8183 `AgentJobEscrow` is configured
        (`AGENT_JOB_ESCROW_ADDRESS_<chainId>`), a paid job is **USDC-only**
        (decision D8) and its budget is escrowed on-chain: the requester's wallet
        runs `createJob → setBudget → approve → fund` from the transaction queue
        and the response carries an `escrow` object whose `onChainStatus`
        advances `CREATING → OPEN → BUDGET_SET → APPROVED → FUNDED`. The
        provider may only accept once it is `FUNDED`. On other chains the
        legacy flow (DB reservation + optional EscrowModule lock) is unchanged
        and `escrow` is `null`.
      responses:
        '201':
          description: Job created. If `reward` was specified, funds are reserved atomically.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '400':
          description: |
            `VALIDATION_FAILED` (e.g. a `reward` without `chainId` or `token`;
            `details` carries the issues), escrow reservation failed (daily
            volume would be exceeded), or on an ERC-8183 chain:
            `ERC8183_USDC_ONLY` (reward token is not USDC / the escrow token),
            `ERC8183_PROVIDER_IS_REQUESTER`, `ERC8183_PROVIDER_IS_EVALUATOR`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: |
            ERC-8183 chain only. `ERC8183_UNAVAILABLE` (escrow token could not be
            resolved; `message`) or `ERC8183_START_FAILED` (the `createJob` step
            could not be queued; the job is left `FAILED` and the reservation
            released; `jobId` and `reason` are included). `message` / `reason`
            are the sanitized upstream error (for a viem error, its one-line
            summary — never the RPC URL).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/jobs/inbox:
    get:
      tags: [Jobs]
      summary: Jobs assigned to me (as provider)
      parameters:
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/JobStatus' }
      responses:
        '200':
          description: Jobs list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items: { $ref: '#/components/schemas/Job' }

  /v1/jobs/outbox:
    get:
      tags: [Jobs]
      summary: Jobs I created (as requester)
      parameters:
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/JobStatus' }
      responses:
        '200':
          description: Jobs list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items: { $ref: '#/components/schemas/Job' }

  /v1/jobs/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [Jobs]
      summary: Job detail (requester or provider only)
      responses:
        '200':
          description: Job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Jobs]
      summary: Transition a job status
      description: |
        Valid transitions:
        - `PENDING` → `ACCEPTED` | `CANCELLED`
        - `ACCEPTED` → `COMPLETED` | `FAILED` | `CANCELLED`

        When transitioning to `COMPLETED` with a reward, the job moves to
        `PAYMENT_PENDING` and is finalized by the worker: on a legacy chain
        `executeA2APayment()` sends the reward directly; on an ERC-8183 chain the
        provider's wallet calls `submit(jobId, keccak256(result))` and the
        operator evaluator settles (`complete` → provider paid minus the platform
        fee, or `reject` → requester refunded when contested).

        ERC-8183 jobs: `ACCEPTED` requires `escrow.onChainStatus = FUNDED`
        (409 `ESCROW_NOT_FUNDED`); `CANCELLED` / `FAILED` schedule an evaluator
        `reject` that refunds the locked budget. A `COMPLETED` sent while the
        provider's ERC-8004 identity is still being bound to the job
        (`escrow.providerAgentIdStatus = BINDING`) answers 200 with
        `escrow.deferredSubmitAt` set: the `submit` is sent automatically once
        the binding is BOUND / FAILED / SKIPPED.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateJobRequest' }
      responses:
        '200':
          description: Updated job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '400':
          description: Invalid status transition.
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            `ESCROW_NOT_FUNDED` — ERC-8183 job accepted before the budget was
            locked on-chain (body carries `onChainStatus`); or the provider
            record is missing (legacy payment aborted).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: |
            ERC-8183 chain only. `ESCROW_SUBMIT_FAILED` — the provider's `submit`
            could not be queued (`reason`, sanitized); the job is returned to
            `ACCEPTED` so the completion can be retried.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/jobs/{id}/contest:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      tags: [Jobs]
      summary: Contest a submitted deliverable (ERC-8183 jobs, requester only)
      description: |
        Marks the job as contested so the operator evaluator sends `reject`
        (full refund to the requester) instead of `complete`. Allowed only while
        the job is `PAYMENT_PENDING`, the deliverable is `SUBMITTED` on-chain and
        the settlement has not been claimed yet (`ESCROW_EVALUATION_DELAY_SECONDS`
        is the window). The decision is final and recorded on-chain by the hook as
        negative reputation for the provider.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContestJobRequest' }
      responses:
        '200':
          description: Job with `escrow.contestedAt` set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `NOT_ESCROW_JOB` (legacy job) or `CONTEST_NOT_ALLOWED` (not
            `PAYMENT_PENDING` + `SUBMITTED`, or already contested / settling);
            the body carries the current `status`, `onChainStatus`, `contestedAt`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/jobs/{id}/feedback.json:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [Jobs]
      summary: ERC-8004 feedback file for a settled ERC-8183 job (public)
      description: |
        The file whose `keccak256` the backend committed in the `complete` /
        `reject` `optParams` and that the `ReputationHook` emitted as
        `feedbackHash` (see `docs/architecture/erc-8004-integration.md` §4).
        Served byte-for-byte (canonical JSON, recursively sorted keys) so
        `keccak256(body)` equals the on-chain hash. No API key required.
        `404` until the settlement worker has generated it.
      security: []
      responses:
        '200':
          description: Feedback file.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedbackFile' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/jobs/{id}/pay-resource:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      tags: [Jobs]
      summary: Pay an x402 (HTTP 402) resource from the job's remaining budget
      description: |
        The job's **provider** pays a third-party `402` resource with its own
        USDC, within the job's remaining reward budget
        (`reward − Σ reserved/pending/settled/unknown payments on the job`).
        The requester cannot call this (`403 NOT_PROVIDER`); the job must be
        `ACCEPTED` (`409 JOB_NOT_ACTIVE`); the job reward must be denominated
        in USDC on a supported chain (`400 UNSUPPORTED_BUDGET_TOKEN`).

        The backend fetches `url`. On a `402` it checks the offered price
        against the cap — the lower of the remaining budget and `maxAmount` —
        **before anything is signed**, reserves the amount in a durable
        `ResourcePayment` row (under a row lock on the job, so concurrent
        payments cannot overspend), signs an EIP-3009 USDC authorization with
        the provider's wallet and resends the request with
        `PAYMENT-SIGNATURE`. Only USDC on the job's chain is accepted
        (`400 UNSUPPORTED_ASSET`). A non-402 response (free resource, or an
        error) is returned untouched with `payment: null`.

        **Outbound target policy.** Before anything is fetched, the hostname
        is resolved and the request is refused (`400 INVALID_URL`, with
        `refusal` and `hostname`; the address a name resolved to is never
        returned) when the host is — or any address
        it resolves to is — loopback, private, link-local, unique-local,
        unspecified or otherwise reserved (IPv4-mapped and NAT64 addresses are
        judged by their IPv4). The connection is pinned to the validated
        addresses, so a DNS rebind cannot redirect it. Redirects are never
        followed: any `3xx` is `400 REDIRECT_REFUSED`, before or after signing.

        **Idempotency.** `paymentId` is unique per job (a server UUID when
        omitted). A retry with the same id returns the existing row *without a
        second payment* when it is `pending`, `settled` or `unknown`
        (`replayed: true`, `resource: null`); a `reserved` row is an attempt
        in flight (`409 PAYMENT_IN_PROGRESS`); only `refused` /
        `failed_before_signing` rows are retried, on the same row. The id is
        also sent to the server inside the x402 `payment-identifier`
        extension so a cache-enabled server deduplicates on its side.

        **State machine** (`ResourcePayment.status`):
        `reserved → pending → settled | unknown | refused`, plus
        `failed_before_signing` for refusals before any signature. `unknown`
        (timeout or transport error after signing; `502
        PAYMENT_OUTCOME_UNKNOWN`) is never retried automatically and stays
        reserved against the budget until an operator reconciles it.

        When the server provides an `offer-receipt`, it is verified against
        the accepted offer; a mismatch still settles but is stored with
        `receiptVerified: false`. The signed authorization is never echoed
        back; only its nonce and validity window are.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayResourceRequest' }
      responses:
        '200':
          description: |
            The resource was fetched (or the payment replayed). `payment` is the
            ledger row — `settled`, or `unknown` with a `warning` when the
            server reported no settlement — or `null` when the resource never
            asked for payment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayResourceResponse' }
        '400':
          description: |
            `VALIDATION_FAILED`, `INVALID_URL` (not an absolute http(s) URL, or
            refused by the outbound target policy: `refusal` is `private-host`,
            `private-address` or `unresolvable`, with `hostname`; the
            offending resolved address is only logged), `INVALID_BUDGET`, `UNSUPPORTED_BUDGET_TOKEN`
            (the job reward is not USDC) or `UNSUPPORTED_ASSET` (the 402 does
            not offer USDC on the job's chain within the allowed authorization
            window) — nothing was signed — or `REDIRECT_REFUSED`: the resource
            answered `3xx`, which is never followed (`responseStatus`,
            `location` without query string). Before any signature `payment` is
            `null`; after signing `payment.status` is `refused`, or `settled`
            when the server reported a settlement on the redirect (the amount
            is spent; do not retry with a new `paymentId`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourcePaymentError' }
        '402':
          description: |
            `BUDGET_EXCEEDED` — refused before signing; `price`, `remaining` and
            `cap` are base units — or `PAYMENT_REFUSED` — the server answered
            the signed payment (verification rejected, settlement failed, or a
            4xx/5xx) without settling it; `payment.status` is `refused` and the
            same `paymentId` may be retried.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourcePaymentError' }
        '403':
          description: '`NOT_PROVIDER` (only the provider pays), `AGENT_INACTIVE` or `POLICY_PAUSED`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourcePaymentError' }
        '404':
          description: '`JOB_NOT_FOUND`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourcePaymentError' }
        '409':
          description: |
            `JOB_NOT_ACTIVE` (job is not `ACCEPTED`), `PAYMENT_IN_PROGRESS`
            (same `paymentId` currently reserved) or `PAYMENT_ID_CONFLICT`
            (same `paymentId`, different URL or method).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourcePaymentError' }
        '502':
          description: |
            `PAYMENT_FAILED` — the hostname could not be resolved because of a
            transient resolver failure (`stage: resolve`), the 402 was unusable,
            or the request failed / timed out before anything was signed — or
            `PAYMENT_OUTCOME_UNKNOWN` — a
            signed authorization left the process and no answer came back.
            `payment.status` is `unknown`; `authorization` carries the nonce
            and window for reconciliation. Do not retry with a new `paymentId`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourcePaymentError' }

  # ── Admin ───────────────────────────────────────────────────────────────
  /admin/stats:
    get:
      tags: [Admin]
      summary: Dashboard overview
      security:
        - adminSecret: []
      responses:
        '200': { description: Stats. }

  /admin/agents:
    get:
      tags: [Admin]
      summary: All agents with billing
      security:
        - adminSecret: []
      responses:
        '200': { description: Agents. }

  /admin/agents/{id}:
    parameters:
      - $ref: '#/components/parameters/AgentIdPath'
    get:
      tags: [Admin]
      summary: Single agent detail
      security:
        - adminSecret: []
      responses:
        '200': { description: Agent. }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/agents/{id}/transactions:
    parameters:
      - $ref: '#/components/parameters/AgentIdPath'
    get:
      tags: [Admin]
      summary: Agent transaction history
      security:
        - adminSecret: []
      responses:
        '200': { description: Transactions. }

  /admin/agents/{id}/pause:
    parameters:
      - $ref: '#/components/parameters/AgentIdPath'
    post:
      tags: [Admin]
      summary: Emergency kill switch (toggle)
      description: >-
        Flips `agent.active`. When pausing, also sets the DB policy inactive
        (and records that the operator pause did it) so policy checks fail
        closed and the transaction worker rejects (marks FAILED) any
        transaction that was already queued but not yet broadcast. When the
        toggle resumes an agent it behaves exactly like
        `POST /admin/agents/{id}/resume`: the DB policy is re-activated only
        if the operator pause deactivated it, and the response says what
        happened (`policyReactivated`, `policyNote`).
        The backend performs NO on-chain call. Pass `syncOnChain: true` to
        receive `AgentPolicyModule.emergencyPause(safe)` (or `resume(safe)`)
        calldata in `onChainSync` for the operator to broadcast via
        `POST /admin/transactions/batch`.
      security:
        - adminSecret: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PauseAgentRequest' }
      responses:
        '200':
          description: >-
            Pause toggled. `{ active: false, onChainSync }` when the agent was
            paused; the `ResumeAgentResponse` shape when it was resumed. When
            `syncOnChain=true` and the agent's chain has a policy module,
            `onChainSync` carries the calldata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PauseAgentResponse' }
        '404': { description: Agent not found. }

  /admin/agents/{id}/resume:
    parameters:
      - $ref: '#/components/parameters/AgentIdPath'
    post:
      tags: [Admin]
      summary: Resume a paused agent (idempotent)
      description: >-
        Explicit, non-toggling counterpart of the pause route. Sets
        `agent.active = true` and re-activates the DB policy **only if the
        operator pause deactivated it** (tracked by
        `AgentPolicy.pausedByOperatorAt`). A policy that was already inactive
        before the pause — agent soft-delete, `PATCH active=false`, or a pause
        that predates the marker — stays inactive and `policyNote` says to use
        `PATCH /v1/agents/{id}/policy`. Calling it on an agent that is not
        paused is a no-op (`agentReactivated: false`).
        The backend performs NO on-chain call. Pass `syncOnChain: true` to
        receive `AgentPolicyModule.resume(safe)` calldata in `onChainSync` for
        the operator to broadcast via `POST /admin/transactions/batch`
        (returned even on a no-op, so the chain can be re-synced on its own).
      security:
        - adminSecret: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PauseAgentRequest' }
      responses:
        '200':
          description: Agent is active. The body says whether the agent and its policy were actually changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumeAgentResponse' }
        '404': { description: Agent not found. }

  /admin/agents/{id}/pnl:
    parameters:
      - $ref: '#/components/parameters/AgentIdPath'
    get:
      tags: [Admin]
      summary: P&L for any agent (admin view)
      security:
        - adminSecret: []
      parameters:
        - in: query
          name: since
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: P&L breakdown.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PnLBreakdown' }

  /admin/transactions:
    get:
      tags: [Admin]
      summary: Global transaction log
      security:
        - adminSecret: []
      responses:
        '200': { description: Transactions. }

  /admin/transactions/batch:
    post:
      tags: [Admin]
      summary: Operator batch execution
      security:
        - adminSecret: []
      responses:
        '202': { description: Batch queued. }

  /admin/transactions/{id}/approve:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      tags: [Admin]
      summary: Approve a PENDING_APPROVAL transaction
      security:
        - adminSecret: []
      responses:
        '200': { description: Approved. }

  /admin/transactions/{id}/reject:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      tags: [Admin]
      summary: Reject a PENDING_APPROVAL transaction
      security:
        - adminSecret: []
      responses:
        '200': { description: Rejected. }

  /admin/volume:
    get:
      tags: [Admin]
      summary: Daily volume chart (7 days)
      security:
        - adminSecret: []
      responses:
        '200': { description: Daily volume series. }

  /admin/revenue:
    get:
      tags: [Admin]
      summary: Revenue breakdown by tier
      security:
        - adminSecret: []
      responses:
        '200': { description: Revenue. }

  /admin/reputation/recompute:
    post:
      tags: [Admin]
      summary: Recompute reputation (all or single agent)
      security:
        - adminSecret: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                agentId:
                  type: string
                  description: If provided, only this agent is recomputed.
      responses:
        '200': { description: Recompute result. }

  /admin/reputation/{agentId}:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
    get:
      tags: [Admin]
      summary: Reputation detail (persisted vs computed drift)
      security:
        - adminSecret: []
      responses:
        '200': { description: Reputation detail. }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── MCP ─────────────────────────────────────────────────────────────────
  /mcp/sse:
    get:
      tags: [MCP]
      summary: Server-Sent Events stream for MCP tool calls
      description: |
        Opens an SSE stream. Clients post JSON-RPC messages to
        `/mcp/messages?sessionId=<id>` and receive results here.

        **Note:** This endpoint exposes a thin 18-tool proxy. The
        standalone `@agent_fi/mcp-server` package offers 28 tools including
        A2A collaboration, agent profile, and P&L checks — prefer it when
        possible.
      responses:
        '200':
          description: SSE stream.
          content:
            text/event-stream:
              schema: { type: string }

  /mcp/messages:
    post:
      tags: [MCP]
      summary: JSON-RPC message handler (paired with /mcp/sse)
      parameters:
        - in: query
          name: sessionId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202': { description: Accepted. }

components:
  securitySchemes:
    agentApiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Agent-scoped API key (`agfi_live_<hex>`).
    operatorApiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Operator shared secret. Accepted by `POST /v1/agents` and `PATCH /v1/agents/{id}/policy` (may loosen any agent's policy).
    adminSecret:
      type: apiKey
      in: header
      name: x-admin-secret
      description: Operator admin secret. Required for `/admin/*`.

  parameters:
    AgentIdPath:
      in: path
      name: id
      required: true
      schema: { type: string }
      description: Agent CUID.
    ChainIdQuery:
      in: query
      name: chainId
      required: false
      schema: { type: integer, default: 1 }
      description: EVM chain ID (1=Ethereum, 8453=Base, 42161=Arbitrum, 137=Polygon).

  responses:
    BadRequest:
      description: Validation failed or malformed request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Access denied (wrong agent or insufficient permissions).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource does not exist.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    IdempotencyConflict:
      description: The `idempotencyKey` is in use by another agent.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PolicyViolation:
      description: Action blocked by the agent's operational policy.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SimulationFailed:
      description: On-chain simulation reverted or produced an error before broadcast.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SimulationUnavailable:
      description: |
        No usable simulation could authorise the transaction, so it was refused.
        Body: `{ "error": "Simulation unavailable in production" }`.

        In `production`/`staging` the backend never acts on a development mock
        simulation: Tenderly is used when configured, otherwise a real `eth_call`
        (`estimateGas`) dry-run. This response is the defense-in-depth guard for
        the case where only a mock result exists in such an environment.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Monthly transaction limit reached for the agent's tier.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotImplemented:
      description: Feature is not yet implemented (blocked on external integration).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: |
        Unexpected server error, on any operation. Body:
        `{ "error": "Internal error", "code": "INTERNAL_ERROR", "traceId": "3f9a1c07b2de" }`.
        The underlying message (which may come from an RPC node, the database
        or a wallet provider) is never returned; the operator's log holds it
        under the same `traceId`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/InternalError' }
    TransactionAccepted:
      description: |
        The request is valid, policy-approved, and has been queued.
        The transaction will be broadcast by a background worker.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TransactionAccepted' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: >-
            Human-readable message. Text that comes from an upstream (RPC node,
            wallet provider, x402 server) is sanitized: no keys, credentialed or
            keyed URLs, internal hosts, stack frames or file paths.
        code:
          type: string
          description: >-
            Stable machine-readable code where the operation documents one
            (e.g. `VALIDATION_FAILED`, `INTERNAL_ERROR`, `ESCROW_NOT_FUNDED`).
        details:
          description: Optional additional context (string, object, or array).
        traceId:
          type: string
          pattern: '^[0-9a-f]{12}$'
          description: >-
            Present on `INTERNAL_ERROR`. The operator's log holds the full
            error under the same id; quote it when reporting a problem.

    InternalError:
      type: object
      required: [error, code, traceId]
      description: >-
        Body of every unexpected server error (5xx). The underlying message is
        never returned; it is logged with the same `traceId`.
      properties:
        error: { type: string, enum: ['Internal error'] }
        code: { type: string, enum: [INTERNAL_ERROR] }
        traceId: { type: string, pattern: '^[0-9a-f]{12}$', example: 3f9a1c07b2de }

    PolicyChangeForbidden:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            loosenedFields:
              type: array
              description: |
                Policy fields the agent tried to loosen. Only present when the rejection
                is a loosening attempt (not when the key belongs to another agent).
              items:
                type: string
                enum:
                  - maxValuePerTxEth
                  - maxDailyVolumeUsd
                  - allowedContracts
                  - allowedTokens
                  - cooldownSeconds
                  - active
                  - expiresAt

    HealthStatus:
      type: object
      properties:
        status: { type: string, example: ok }
        uptime: { type: number }

    ReadinessStatus:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded] }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, fail] }

    AgentTier:
      type: string
      enum: [FREE, PRO, ENTERPRISE]

    TxStatus:
      type: string
      enum:
        - SIMULATING
        - PENDING_APPROVAL
        - QUEUED
        - SUBMITTED
        - CONFIRMED
        - FAILED
        - REVERTED

    JobStatus:
      type: string
      description: |
        `PAYMENT_PENDING` — provider marked the work done; the payment (legacy
        direct transfer) or the ERC-8183 `submit` → evaluator settlement is in
        flight. `PAYMENT_FAILED` — the payment failed or the evaluator rejected
        / the escrow expired; the budget was refunded to the requester.
      enum: [PENDING, ACCEPTED, COMPLETED, FAILED, CANCELLED, PAYMENT_PENDING, PAYMENT_FAILED]

    CreateAgentRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        chainIds:
          type: array
          minItems: 1
          items: { type: integer }
          default: [1]
        tier:
          $ref: '#/components/schemas/AgentTier'
        policy: { $ref: '#/components/schemas/Policy' }

    CreateAgentResponse:
      type: object
      required: [id, name, apiKey, safeAddress, chainIds, tier]
      properties:
        id: { type: string }
        name: { type: string }
        apiKey:
          type: string
          description: Plaintext — shown once, never stored. Keep it safe.
          example: agfi_live_abc123...
        apiKeyPrefix: { type: string }
        walletAddress: { type: string }
        safeAddress: { type: string }
        chainIds:
          type: array
          items: { type: integer }
        tier: { $ref: '#/components/schemas/AgentTier' }
        ensName:
          type: string
          nullable: true
          description: ENS subdomain pointing at the Safe address. Null when ENS isn't configured.

    AgentSearchResult:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        chainIds:
          type: array
          items: { type: integer }
        tier: { $ref: '#/components/schemas/AgentTier' }

    Agent:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        apiKeyPrefix: { type: string }
        walletAddress: { type: string }
        ensName:
          type: string
          nullable: true
        chainIds:
          type: array
          items: { type: integer }
        active: { type: boolean }
        tier: { $ref: '#/components/schemas/AgentTier' }
        erc8004:
          type: array
          description: |
            The agent's ERC-8004 identities, one per chain (R2). Minted lazily
            from the agent's own wallet on its first funded ERC-8183 job as a
            provider; empty until then.
          items: { $ref: '#/components/schemas/AgentErc8004Identity' }
        policy:
          type: object
          nullable: true
          allOf:
            - { $ref: '#/components/schemas/Policy' }
        billing:
          type: object
          nullable: true
          properties:
            txCountThisPeriod: { type: integer }
            totalFeesCollectedUsd: { type: string }
            subscriptionActive: { type: boolean }

    Policy:
      type: object
      properties:
        maxValuePerTxEth:
          type: string
          pattern: '^\d+(\.\d+)?$'
          example: "1.0"
          description: Plain decimal string. Empty, whitespace, exponent, hex or non-numeric values are rejected (400).
        maxDailyVolumeUsd:
          type: string
          pattern: '^\d+(\.\d+)?$'
          example: "10000"
          description: Plain decimal string; `"0"` means no daily limit. Same validation as `maxValuePerTxEth`.
        allowedContracts:
          type: array
          items: { type: string }
        allowedTokens:
          type: array
          items: { type: string }
        cooldownSeconds: { type: integer, default: 60 }
        active: { type: boolean, default: true }
        expiresAt:
          type: string
          format: date-time
          nullable: true
        pausedByOperatorAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: Set while the policy is inactive because `POST /admin/agents/{id}/pause` deactivated it; the admin resume re-activates the policy only while this is set. Cleared by any explicit `active` write.

    UpdatePolicyRequest:
      allOf:
        - $ref: '#/components/schemas/Policy'
        - type: object
          properties:
            syncOnChain:
              type: boolean
              default: false
              description: If true, response includes calldata for on-chain policy sync.
            reason:
              type: string
              maxLength: 500
              description: |
                Free-text justification. Written to the backend's policy audit log line
                (together with agent id, caller kind and changed fields). Not stored and
                does not gate the change.

    OnChainSync:
      type: object
      nullable: true
      description: Calldata for the operator to broadcast. The backend never broadcasts it.
      properties:
        to: { type: string }
        chainId: { type: integer }
        actions:
          type: array
          items:
            type: object
            properties:
              to: { type: string }
              value: { type: string }
              data: { type: string }
        notice: { type: string }

    UpdatePolicyResponse:
      allOf:
        - $ref: '#/components/schemas/Policy'
        - type: object
          properties:
            onChainSync:
              $ref: '#/components/schemas/OnChainSync'

    PauseAgentRequest:
      type: object
      properties:
        syncOnChain:
          type: boolean
          default: false
          description: If true, response includes `emergencyPause(safe)` / `resume(safe)` calldata for on-chain sync.

    PausedAgentResponse:
      type: object
      required: [active, onChainSync]
      properties:
        active:
          type: boolean
          enum: [false]
          description: Always `false` — the toggle paused the agent.
        onChainSync:
          $ref: '#/components/schemas/OnChainSync'

    ResumeAgentResponse:
      type: object
      required: [active, agentReactivated, policyReactivated, policyNote, onChainSync]
      properties:
        active:
          type: boolean
          enum: [true]
          description: Always `true` after a resume.
        agentReactivated:
          type: boolean
          description: "`true` when `agent.active` was flipped from false to true; `false` when the agent was not paused (no-op)."
        policyReactivated:
          type: boolean
          description: "`true` when the DB policy was re-activated because the operator pause had deactivated it."
        policyNote:
          type: string
          description: Why the policy was or was not re-activated (already active, no policy row, or deactivated independently of the pause — use `PATCH /v1/agents/{id}/policy`).
        onChainSync:
          $ref: '#/components/schemas/OnChainSync'

    PauseAgentResponse:
      description: "`PausedAgentResponse` when the toggle paused the agent, `ResumeAgentResponse` when it resumed it."
      oneOf:
        - $ref: '#/components/schemas/PausedAgentResponse'
        - $ref: '#/components/schemas/ResumeAgentResponse'

    TrustReport:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        reputationScore: { type: integer, minimum: 0, maximum: 1000 }
        a2aTxCount: { type: integer }
        lastActiveAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    SignedHandshake:
      type: object
      description: |
        An AgentFi handshake (S6): `signature` is over the EIP-712 digest of
        `typedData` — domain `{ name: "AgentFi Handshake", version: "1" }`,
        primary type `AgentFiHandshake(address agent,string message,uint64 issuedAt)`.
      required: [message, issuedAt, signature, address, safeAddress, digest, typedData]
      properties:
        message: { type: string }
        issuedAt: { type: integer, description: Unix seconds at signing (set by the server). }
        signature: { type: string, pattern: '^0x[0-9a-fA-F]+$', description: 65-byte r||s||v ECDSA signature. }
        address:
          type: string
          pattern: '^0x[0-9a-fA-F]{40}$'
          description: The signing address (the envelope's `agent`). For a Safe-mode agent this is the Safe's owner key, not the Safe.
        safeAddress: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
        digest: { type: string, pattern: '^0x[0-9a-fA-F]{64}$', description: EIP-712 digest that was signed. }
        typedData:
          type: object
          required: [domain, types, primaryType, message]
          properties:
            domain:
              type: object
              properties:
                name: { type: string, enum: ['AgentFi Handshake'] }
                version: { type: string, enum: ['1'] }
            types:
              type: object
              additionalProperties:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    type: { type: string }
            primaryType: { type: string, enum: ['AgentFiHandshake'] }
            message:
              type: object
              properties:
                agent: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
                message: { type: string }
                issuedAt: { type: integer }

    PnLBreakdown:
      type: object
      properties:
        agentId: { type: string }
        name: { type: string }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        earnings:
          type: object
          properties:
            a2aJobsAsProvider: { $ref: '#/components/schemas/CountUsd' }
            totalEarningsUsd: { type: string }
        costs:
          type: object
          properties:
            protocolFees: { $ref: '#/components/schemas/CountUsd' }
            a2aJobsAsRequester: { $ref: '#/components/schemas/CountUsd' }
            gas: { $ref: '#/components/schemas/CountUsd' }
            totalCostsUsd: { type: string }
        netPnlUsd: { type: string }
        breakEven: { type: boolean }
        profitable: { type: boolean }
        notes:
          type: array
          items: { type: string }

    CountUsd:
      type: object
      properties:
        count: { type: integer }
        usd: { type: string }

    # ── Transaction requests ─────────────────────────────────────────────
    SimulateSwapRequest:
      type: object
      required: [fromToken, toToken, amountIn]
      properties:
        fromToken: { type: string }
        toToken: { type: string }
        amountIn:
          type: string
          description: Human-readable decimal amount (not wei).
        chainId: { type: integer, default: 1 }
        slippageTolerance:
          type: number
          minimum: 0.01
          maximum: 50
          default: 0.5

    ExecuteSwapRequest:
      allOf:
        - $ref: '#/components/schemas/SimulateSwapRequest'
        - type: object
          required: [simulationId]
          properties:
            simulationId: { type: string }
            idempotencyKey: { type: string }

    TransferRequest:
      type: object
      required: [to, token, amount]
      properties:
        token:
          type: string
          description: '"ETH" or an ERC-20 contract address.'
        to: { type: string }
        amount: { type: string }
        chainId: { type: integer, default: 1 }
        idempotencyKey: { type: string }

    AssetAmountRequest:
      type: object
      required: [asset, amount]
      properties:
        asset: { type: string, description: Token address. }
        amount:
          type: string
          description: Human-readable decimal amount, or "max" for withdraws.
        chainId: { type: integer, default: 1 }
        idempotencyKey: { type: string }

    Erc4626Request:
      type: object
      required: [vault, asset, amount]
      properties:
        vault: { type: string, description: Vault contract address. }
        asset: { type: string, description: Underlying token (for decimals + pricing). }
        amount: { type: string }
        chainId: { type: integer, default: 1 }
        idempotencyKey: { type: string }

    CurveSwapRequest:
      type: object
      required: [pool, fromTokenIndex, toTokenIndex, fromTokenAddress, toTokenAddress, amountIn, minAmountOut]
      properties:
        pool: { type: string }
        fromTokenIndex: { type: integer, minimum: 0, maximum: 7 }
        toTokenIndex: { type: integer, minimum: 0, maximum: 7 }
        fromTokenAddress: { type: string }
        toTokenAddress: { type: string }
        amountIn: { type: string }
        minAmountOut: { type: string }
        chainId: { type: integer, default: 1 }
        idempotencyKey: { type: string }

    BatchRequest:
      type: object
      required: [actions]
      description: |
        Up to 20 raw calldata actions executed atomically through
        `AgentExecutor.executeBatch`. Each action's `token` is **caller-declared**:
        the backend does not decode `data` to discover which ERC-20 a call really
        touches, so both the off-chain `allowedTokens` whitelist and the on-chain
        policy module check the declared value. `allowedContracts` (checked against
        `to`) is the binding policy control for raw calldata.
      properties:
        chainId: { type: integer, default: 1 }
        idempotencyKey: { type: string }
        actions:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [to]
            properties:
              to:
                type: string
                description: Target contract. Checked against the agent's `allowedContracts` whitelist.
              value: { type: string, default: "0" }
              token:
                type: string
                pattern: '^0x[0-9a-fA-F]{40}$'
                default: "0x0000000000000000000000000000000000000000"
                description: |
                  Caller-declared ERC-20 the action moves; the zero address means pure ETH /
                  no token. Checked against `allowedTokens` when the agent has a whitelist.
                  When the agent has a non-empty `allowedTokens` whitelist, every action
                  with non-empty `data` must declare a token — otherwise `400`
                  `{ "error": "token is required for this action because the agent has a token whitelist", "actionIndex": n }`.
              data:
                type: string
                pattern: '^0x[0-9a-fA-F]*$'
                default: "0x"

    # ── Transaction reads ────────────────────────────────────────────────
    TransactionAccepted:
      type: object
      properties:
        transactionId: { type: string }
        status: { $ref: '#/components/schemas/TxStatus' }
        fee:
          type: object
          nullable: true
          properties:
            bps: { type: integer }
            amountWei: { type: string }
            feeWallet: { type: string }

    Transaction:
      type: object
      properties:
        id: { type: string }
        agentId: { type: string }
        chainId: { type: integer }
        txHash:
          type: string
          nullable: true
        status: { $ref: '#/components/schemas/TxStatus' }
        type:
          type: string
          enum: [SWAP, TRANSFER, DEPOSIT, WITHDRAW, BATCH]
        fromToken: { type: string, nullable: true }
        toToken: { type: string, nullable: true }
        amountIn: { type: string, nullable: true }
        amountOut: { type: string, nullable: true }
        gasUsed: { type: string, nullable: true }
        effectiveGasPriceWei: { type: string, nullable: true }
        error:
          type: string
          nullable: true
          description: Why the transaction failed (sanitized broadcast / node error — no RPC URLs or keys).
        simulation:
          nullable: true
          type: object
          additionalProperties: true
          description: Stored simulation result; its `error` is sanitized like `error`.
        metadata:
          nullable: true
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        confirmedAt:
          type: string
          format: date-time
          nullable: true

    PublicTransaction:
      type: object
      properties:
        id: { type: string }
        chainId: { type: integer }
        status: { $ref: '#/components/schemas/TxStatus' }
        type: { type: string }
        txHash:
          type: string
          nullable: true
        createdAt: { type: string, format: date-time }
        confirmedAt:
          type: string
          format: date-time
          nullable: true

    TransactionPage:
      type: object
      properties:
        transactions:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }
        nextCursor:
          type: string
          nullable: true

    SimulationResult:
      type: object
      properties:
        simulationId: { type: string }
        success: { type: boolean }
        gasEstimate: { type: string }
        amountOut: { type: string }
        error:
          type: string
          nullable: true

    # ── Wallet ───────────────────────────────────────────────────────────
    WalletAddresses:
      type: object
      properties:
        safeAddress: { type: string }
        eoaAddress: { type: string }

    WalletBalance:
      type: object
      properties:
        chainId: { type: integer }
        native:
          type: object
          properties:
            wei: { type: string }
            formatted: { type: string }
            usd: { type: string }
        tokens:
          type: array
          items:
            type: object
            properties:
              address: { type: string }
              symbol: { type: string }
              decimals: { type: integer }
              balance: { type: string }
              usd: { type: string }

    Allowance:
      type: object
      properties:
        token: { type: string }
        spender: { type: string }
        amount: { type: string }

    # ── Billing ──────────────────────────────────────────────────────────
    BillingStatus:
      type: object
      properties:
        tier: { $ref: '#/components/schemas/AgentTier' }
        subscriptionActive: { type: boolean }
        subscriptionPeriodEnd:
          type: string
          format: date-time
          nullable: true
        txCountThisPeriod: { type: integer }
        txLimitThisPeriod:
          type: integer
          nullable: true
        totalFeesCollectedUsd: { type: string }

    # ── Jobs ─────────────────────────────────────────────────────────────
    JobReward:
      type: object
      description: |
        Reward as stored on the job (`{}` for a free job). Jobs created before
        X3a carry the old request defaults (`token: ETH`, `chainId: 1`) when
        the caller left them out.
      properties:
        amount: { type: string }
        token: { type: string }
        chainId: { type: integer }

    CreateJobReward:
      type: object
      description: |
        A paid job names its chain and token; there are no defaults (a missing
        `chainId` or `token` is `400 VALIDATION_FAILED`, the `details` say what
        to set). On an ERC-8183 escrow-enabled chain the token must be USDC
        (`"USDC"` or the escrow's token address), otherwise `400
        ERC8183_USDC_ONLY` (decision D8).
      required: [amount, token, chainId]
      properties:
        amount:
          type: string
          description: Human-readable amount, e.g. `"1.5"` (USDC has 6 decimals).
          example: '1.5'
        token:
          type: string
          description: Token symbol or address. New jobs use USDC (D8).
          example: USDC
        chainId:
          type: integer
          minimum: 1
          description: Chain the reward is paid on, e.g. 84532 (Base Sepolia) or 8453 (Base).
          example: 84532

    CreateJobRequest:
      type: object
      required: [providerId, payload]
      properties:
        providerId:
          type: string
          description: CUID of the agent that will execute this job.
        payload:
          type: object
          additionalProperties: true
        reward: { $ref: '#/components/schemas/CreateJobReward' }
        signature: { type: string }

    UpdateJobRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACCEPTED, COMPLETED, FAILED, CANCELLED]
        result:
          type: object
          additionalProperties: true
        error: { type: string }

    Job:
      type: object
      properties:
        id: { type: string }
        requesterId: { type: string }
        providerId: { type: string }
        status: { $ref: '#/components/schemas/JobStatus' }
        payload:
          type: object
          additionalProperties: true
        reward:
          type: object
          nullable: true
          allOf:
            - { $ref: '#/components/schemas/JobReward' }
        signature: { type: string, nullable: true }
        result:
          nullable: true
          type: object
          additionalProperties: true
        reservedAmount: { type: string, nullable: true }
        reservedToken: { type: string, nullable: true }
        reservedChainId: { type: integer, nullable: true }
        reservedAt: { type: string, format: date-time, nullable: true }
        reservationStatus:
          type: string
          enum: [PENDING, RELEASED, CANCELLED]
          nullable: true
        escrow:
          type: object
          nullable: true
          description: ERC-8183 on-chain escrow state; `null` for legacy and free jobs.
          allOf:
            - { $ref: '#/components/schemas/JobEscrow' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    JobEscrow:
      type: object
      description: |
        Backend view of the `AgentJobEscrow` job backing this AgentFi job.
        `onChainStatus` is the last confirmed step: `CREATING → OPEN → BUDGET_SET
        → APPROVED → FUNDED → SUBMITTED → SETTLING → COMPLETED | REJECTED`;
        `FUNDED`/`SUBMITTED → EXPIRED` after `expiresAt` (claimRefund); `FAILED`
        when a step before `FUNDED` failed (nothing locked; job `FAILED`).
      properties:
        kind: { type: string, enum: [erc8183] }
        chainId: { type: integer, nullable: true }
        contract: { type: string, nullable: true, description: AgentJobEscrow address. }
        onChainJobId: { type: string, nullable: true, description: uint256 job id as a decimal string. }
        onChainStatus:
          type: string
          nullable: true
          enum: [CREATING, OPEN, BUDGET_SET, APPROVED, FUNDED, SUBMITTED, SETTLING, COMPLETED, REJECTED, EXPIRED, FAILED]
        evaluator: { type: string, nullable: true, description: Operator evaluator signer (decision D5). }
        budgetAmount: { type: string, nullable: true, description: 'Budget in token base units (USDC, 6 decimals).' }
        budgetToken: { type: string, nullable: true, description: Escrow ERC-20 (USDC) address. }
        expiresAt: { type: string, format: date-time, nullable: true, description: On-chain `expiredAt`; refundable after it. }
        deliverableHash: { type: string, nullable: true, description: keccak256 of the result JSON passed to `submit`. }
        settleTxHash: { type: string, nullable: true, description: Evaluator's complete / reject / claimRefund transaction. }
        platformFeeAmount: { type: string, nullable: true, description: Platform fee accrued on completion (base units). }
        feedbackStatus:
          type: string
          nullable: true
          description: ERC-8004 feedback outcome from the hook — `written`, `skipped:<reason>` or `failed`.
        contestedAt: { type: string, format: date-time, nullable: true }
        contestReason: { type: string, nullable: true, description: Reason given by the requester when contesting. }
        escrowError: { type: string, nullable: true, description: 'Last escrow step or settlement error (sanitized: no RPC URLs, keys or internal hosts).' }
        providerAgentId:
          type: string
          nullable: true
          description: |
            ERC-8004 agent id of the provider attached to the on-chain job with
            `setProviderAgentId` (decimal string), read by the ReputationHook at
            settlement (R2). Set when the bind transaction is enqueued.
        providerAgentIdStatus:
          type: string
          nullable: true
          enum: [BINDING, BOUND, FAILED, SKIPPED]
          description: |
            Identity binding started when `fund` confirmed: `BINDING` (the
            provider's `register` and/or `setProviderAgentId` in flight),
            `BOUND`, `FAILED` (revert, guard block or retries exhausted — the job
            proceeds, the hook skips feedback) or `SKIPPED` (no reputation hook
            or identity registry on the chain, job no longer funded). `null` for
            jobs funded before R2. Never blocks payment.
        providerAgentIdError: { type: string, nullable: true, description: Why the binding FAILED or was SKIPPED (sanitized). }
        deferredSubmitAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Set when the provider completed (`PATCH status=COMPLETED`) while the
            binding was `BINDING`: `submit` is sent automatically once the
            binding is terminal, because `setProviderAgentId` is only valid
            before the job is Submitted. `null` once released.

    AgentErc8004Identity:
      type: object
      properties:
        chainId: { type: integer }
        registry: { type: string, description: ERC-8004 Identity Registry address. }
        agentId:
          type: string
          nullable: true
          description: ERC-721 tokenId (decimal string); `null` until the mint is confirmed.
        status: { type: string, enum: [REGISTERING, REGISTERED, FAILED] }

    Erc8004RegistrationFile:
      type: object
      description: EIP-8004 agent registration file (`registration-v1`).
      required: [type, name, description, services, x402Support, active, registrations, supportedTrust]
      properties:
        type: { type: string, example: 'https://eips.ethereum.org/EIPS/eip-8004#registration-v1' }
        name: { type: string }
        description: { type: string }
        services:
          type: array
          items:
            type: object
            required: [name, endpoint]
            properties:
              name: { type: string, example: web }
              endpoint: { type: string }
              version: { type: string }
        x402Support: { type: boolean, description: Always false — AgentFi agents do not sell behind HTTP 402. }
        active: { type: boolean }
        registrations:
          type: array
          items:
            type: object
            required: [agentId, agentRegistry]
            properties:
              agentId:
                description: tokenId; a JSON number when it fits in 2^53, else a decimal string.
                oneOf:
                  - { type: integer }
                  - { type: string }
              agentRegistry: { type: string, example: 'eip155:84532:0x8004A818BFB912233c491871b3d84c89A494BD9e' }
        supportedTrust:
          type: array
          items: { type: string, enum: [reputation] }

    ContestJobRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 500 }

    FeedbackFile:
      type: object
      description: ERC-8004 feedback file (`feedback-v1`), hashed on-chain as `feedbackHash`.
      properties:
        type: { type: string, example: 'https://eips.ethereum.org/EIPS/eip-8004#feedback-v1' }
        jobId: { type: string }
        escrow:
          type: object
          properties:
            chainId: { type: integer }
            contract: { type: string }
            onChainJobId: { type: integer }
        proofOfPayment:
          type: object
          description: The `fund` transaction that escrowed the budget.
          properties:
            chainId: { type: integer }
            txHash: { type: string, nullable: true }
            fromAddress: { type: string }
            toAddress: { type: string }
        outcome: { type: string, enum: [completed, rejected] }
        deliverableHash: { type: string, nullable: true }
        evaluator: { type: string }
        issuedAt: { type: string, format: date-time }
    ResourcePaymentStatus:
      type: string
      description: |
        Ledger state of a job-scoped x402 payment:
        `reserved` (budget checked, nothing signed) → `pending` (authorization
        signed and sent) → `settled` | `unknown` (no answer after signing;
        money may have moved, never retried automatically) | `refused`
        (server answered 4xx/5xx after signing, no settlement);
        `failed_before_signing` for refusals before any signature.
      enum: [reserved, pending, settled, unknown, refused, failed_before_signing]

    ResourcePayment:
      type: object
      description: One attempt to pay a 402 resource from a job budget. Never carries the signed authorization.
      properties:
        id: { type: string }
        jobId: { type: string }
        agentId: { type: string, description: The payer — the job's provider. }
        url: { type: string, description: 'Origin + path only; query string, fragment and userinfo are stripped.' }
        method: { type: string, enum: [GET, POST] }
        network: { type: string, description: 'CAIP-2 id, e.g. `eip155:84532`.' }
        asset: { type: string, description: USDC contract on the job's chain. }
        amount: { type: string, description: 'Price in base units (`"400000"` = 0.40 USDC).' }
        payTo: { type: string }
        paymentId: { type: string, description: 'x402 `payment-identifier` id, unique per job.' }
        authorizationNonce:
          type: string
          nullable: true
          description: EIP-3009 / Permit2 nonce of the signed authorization; set once signed.
        status: { $ref: '#/components/schemas/ResourcePaymentStatus' }
        receipt:
          type: object
          nullable: true
          additionalProperties: true
          description: Raw `offer-receipt` receipt from the resource server, when provided.
        receiptVerified:
          type: boolean
          nullable: true
          description: True when the receipt verified against the accepted offer; false means it was marked unverified.
        settlementTxHash: { type: string, nullable: true }
        responseStatus: { type: integer, nullable: true }
        error: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PayResourceRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: >-
            Absolute http(s) URL of the 402 resource. Query strings are sent but
            never stored or logged. Must resolve only to public addresses
            (outbound target policy); redirects are not followed.
        method: { type: string, enum: [GET, POST], default: GET }
        body:
          description: JSON body; only allowed with `POST`.
        maxAmount:
          type: string
          pattern: '^\d+(\.\d{1,6})?$'
          description: 'Caller cap in USDC human units (e.g. `"0.50"`); the lower of this and the remaining job budget applies.'
        paymentId:
          type: string
          pattern: '^[A-Za-z0-9_-]{16,128}$'
          description: Idempotency key, unique per job. Server-generated UUID when omitted; reuse it on retries.

    RemainingBudget:
      type: object
      properties:
        asset: { type: string, description: USDC contract on the job's chain. }
        symbol: { type: string, example: USDC }
        decimals: { type: integer, example: 6 }
        network: { type: string, example: 'eip155:84532' }
        total: { type: string, description: Job reward in base units. }
        spent: { type: string, description: 'Base units reserved, pending, settled or unknown.' }
        remaining: { type: string, description: Base units. }
        remainingFormatted: { type: string, example: '0.6' }

    ResourceResponse:
      type: object
      description: The resource server's final response, capped at 64 KiB.
      properties:
        status: { type: integer }
        headers:
          type: object
          additionalProperties: { type: string }
          description: Whitelisted headers only (content-type, content-length, cache-control, etag, last-modified, date, x-request-id).
        body:
          description: Parsed JSON when the response is JSON and fits the cap; otherwise text.
        truncated: { type: boolean, description: True when the body was cut at 64 KiB. }

    PayResourceResponse:
      type: object
      required: [payment, remainingBudget, resource]
      properties:
        payment:
          type: object
          nullable: true
          allOf:
            - { $ref: '#/components/schemas/ResourcePayment' }
        remainingBudget: { $ref: '#/components/schemas/RemainingBudget' }
        resource:
          type: object
          nullable: true
          allOf:
            - { $ref: '#/components/schemas/ResourceResponse' }
        replayed:
          type: boolean
          description: True when an existing `pending` / `settled` / `unknown` row was returned without a new payment.
        warning:
          type: string
          description: Present when `payment.status` is `unknown`.

    ResourcePaymentError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_FAILED
                - INVALID_URL
                - REDIRECT_REFUSED
                - INVALID_BUDGET
                - UNSUPPORTED_BUDGET_TOKEN
                - UNSUPPORTED_ASSET
                - BUDGET_EXCEEDED
                - NOT_PROVIDER
                - AGENT_INACTIVE
                - POLICY_PAUSED
                - JOB_NOT_FOUND
                - JOB_NOT_ACTIVE
                - PAYMENT_IN_PROGRESS
                - PAYMENT_ID_CONFLICT
                - PAYMENT_REFUSED
                - PAYMENT_FAILED
                - PAYMENT_OUTCOME_UNKNOWN
                - LEDGER_ERROR
            paymentId: { type: string }
            price:
              type: string
              nullable: true
              description: 'Offered price in base units (`BUDGET_EXCEEDED`); `null` when the budget was exhausted before fetching.'
            priceFormatted: { type: string, example: '0.4' }
            remaining: { type: string, description: Remaining job budget in base units. }
            remainingFormatted: { type: string }
            cap: { type: string, description: Effective per-payment cap in base units (min of remaining budget and `maxAmount`). }
            capFormatted: { type: string }
            reason: { type: string, description: 'Server-supplied reason (`PAYMENT_REFUSED`), clipped at 200 characters.' }
            responseStatus: { type: integer }
            refusal:
              type: string
              enum: [private-host, private-address, unresolvable]
              description: >-
                Why the outbound target policy refused the URL (`INVALID_URL`):
                the host is a loopback name or a private/reserved literal, one
                of its resolved addresses is private/reserved, or it does not
                resolve.
            hostname: { type: string, description: 'Hostname the outbound target policy judged (`INVALID_URL`). The private address it resolved to is never returned.' }
            location:
              type: string
              nullable: true
              description: 'Redirect target, resolved and stripped of query string and userinfo (`REDIRECT_REFUSED`); never requested.'
            stage:
              type: string
              enum: [resolve, request, payment-creation, paid-request]
              description: 'Phase that failed (`PAYMENT_FAILED`); `resolve` is a transient DNS failure before anything was fetched.'
            timedOut: { type: boolean }
            authorization:
              type: object
              description: 'Nonce and window of the signed authorization (`PAYMENT_OUTCOME_UNKNOWN`), for reconciliation. Never the signature.'
              properties:
                method: { type: string, enum: [eip3009, permit2] }
                nonce: { type: string }
                validAfter: { type: string }
                validBefore: { type: string }
            payment:
              type: object
              nullable: true
              allOf:
                - { $ref: '#/components/schemas/ResourcePayment' }
