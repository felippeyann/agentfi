name: Feature request
description: Suggest an idea for AgentFi
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste prompts, API keys, private keys, seeds, customer data or logs with secrets.**
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: A clear description of the problem this feature would solve.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the solution you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or features you have considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other context, mockups, or references.
