[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false

[profile.default.fuzz]
runs = 256

[profile.ci.fuzz]
runs = 1000

[rpc_endpoints]
mainnet      = "${ALCHEMY_API_KEY_RPC_MAINNET}"
base         = "${ALCHEMY_API_KEY_RPC_BASE}"
arbitrum     = "${ALCHEMY_API_KEY_RPC_ARB}"
polygon      = "${ALCHEMY_API_KEY_RPC_POLYGON}"
base_sepolia = "https://sepolia.base.org"
arb_sepolia  = "https://sepolia-rollup.arbitrum.io/rpc"

# Etherscan API V2: ONE `ETHERSCAN_API_KEY` (an etherscan.io account key) for every chain, the
# chain selected by id (forge 1.7.1 sends `https://api.etherscan.io/v2/api?chainid=<id>`). No
# per-explorer `url`: the V1 endpoints (`api-sepolia.basescan.org/api`, …) answer "You are using a
# deprecated V1 endpoint". The keys match [rpc_endpoints], so `--rpc-url base_sepolia --verify`
# resolves the entry by alias.
[etherscan]
mainnet      = { key = "${ETHERSCAN_API_KEY}", chain = 1 }
base         = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }
arbitrum     = { key = "${ETHERSCAN_API_KEY}", chain = 42161 }
polygon      = { key = "${ETHERSCAN_API_KEY}", chain = 137 }
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }
arb_sepolia  = { key = "${ETHERSCAN_API_KEY}", chain = 421614 }
