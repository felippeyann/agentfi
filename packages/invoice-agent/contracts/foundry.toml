[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
# forge-std is the monorepo's submodule (packages/contracts/lib/forge-std): tests and the deploy script only.
libs = ["../../contracts/lib"]
remappings = ["forge-std/=../../contracts/lib/forge-std/src/"]
solc = "0.8.24"
# QDay Aevum Testnet is a Shanghai-level chain (PUSH0 works; TSTORE, MCOPY and BLOBBASEFEE are invalid opcodes).
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false

[profile.default.fuzz]
runs = 256

[profile.ci.fuzz]
runs = 1000

[rpc_endpoints]
aevum = "https://rpc-test.qday.info"
